<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DOKKYO Mark Assistant - 移転しました</title>
  <script>
    (function () {
      // 移転先URL。新しい公開URLが異なる場合はこの値を変更してください。
      var NEW_BASE = "https://dokkyosegeln.github.io/dokkyo-dma/";

      // 旧URLのクエリ文字列と共有データ（#guest=... / #data=...）を保持します。
      var oldBasePath = "/mark-assistant/";
      var pathname = window.location.pathname;
      var suffix = pathname.indexOf(oldBasePath) === 0
        ? pathname.slice(oldBasePath.length)
        : "";

      var destination = new URL(NEW_BASE);
      if (suffix) {
        destination.pathname =
          destination.pathname.replace(/\/?$/, "/") + suffix.replace(/^\/+/, "");
      }
      destination.search = window.location.search;
      destination.hash = window.location.hash;

      window.location.replace(destination.toString());
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://dokkyosegeln.github.io/dokkyo-dma/">
  </noscript>
  <style>
    body { margin:0; padding:32px 20px; font-family:system-ui,sans-serif; color:#17232d; background:#f5f7fa; line-height:1.7; }
    main { max-width:560px; margin:8vh auto; padding:24px; background:#fff; border:1px solid #d8e1e7; border-radius:14px; }
    a { color:#002d8c; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>DOKKYO Mark Assistant</h1>
    <p>公開先を移転しました。新しいページへ自動的に移動しています。</p>
    <p>自動で移動しない場合は、こちらを開いてください。</p>
    <p><a href="https://dokkyosegeln.github.io/dokkyo-dma/">新しいDOKKYO Mark Assistant</a></p>
    <p>以前の共有リンクを開いた場合も、共有データを引き継いで新しいページへ移動します。</p>
  </main>
</body>
</html>
